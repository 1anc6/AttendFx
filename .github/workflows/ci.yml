name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: attendfx
          POSTGRES_USER: afx_owner
          POSTGRES_PASSWORD: owner_dev_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U afx_owner -d attendfx"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway CI-only values for the service container above.
      AFX_OWNER_DATABASE_URL: postgresql+psycopg://afx_owner:owner_dev_pw@localhost:5432/attendfx
      AFX_APP_DATABASE_URL: postgresql://afx_app:app_dev_pw@localhost:5432/attendfx
      AFX_AUTH_DATABASE_URL: postgresql://afx_auth:auth_dev_pw@localhost:5432/attendfx
      AFX_SYNC_DATABASE_URL: postgresql://afx_sync:sync_dev_pw@localhost:5432/attendfx
      AFX_APP_PASSWORD: app_dev_pw
      AFX_AUTH_PASSWORD: auth_dev_pw
      AFX_SYNC_PASSWORD: sync_dev_pw
      AFX_SEED_PASSWORD: ci-seed-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . ../evals
      - run: uv run ruff format --check . ../evals
      - run: uv run alembic upgrade head
      - run: uv run python -m app.worker seed
      - run: uv run pytest -q
      - name: 60-question test
        run: uv run python ../evals/run.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # type-checks (tsc -b) before bundling
      - run: npm audit --omit=dev --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks CLI over the full history instead of the action: the action derives a
      # commit range from the push event and fails when the range starts at a root commit.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/${archive}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks detect --source . --redact -v --exit-code 2
      - uses: astral-sh/setup-uv@v5
      - name: Dependency audit (pip-audit)
        working-directory: backend
        run: uv run --frozen pip-audit

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -f infra/Dockerfile -t attendfx:ci .
      # The Trivy CLI from its release, checked against the published checksum (as for gitleaks).
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.76.2"
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -O "${base}/${archive}"
          curl -sSfL -O "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${archive}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" trivy
      # Fail on high or critical issues that have a fix available: OS packages and Python
      # packages in the image, then the Dockerfile itself.
      - name: Image scan (Trivy)
        run: >-
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --no-progress attendfx:ci
      - name: Dockerfile scan (Trivy)
        run: ./trivy config --severity HIGH,CRITICAL --exit-code 1 infra
