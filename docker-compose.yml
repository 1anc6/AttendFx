services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendfx}
      # The container's bootstrap user is the migration owner (dev only).
      POSTGRES_USER: afx_owner
      POSTGRES_PASSWORD: ${AFX_OWNER_PASSWORD:-owner_dev_pw}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afx_owner -d ${POSTGRES_DB:-attendfx}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
